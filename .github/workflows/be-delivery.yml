name: BE delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit delivery mode; activation retains a final FE acceptance hold
        required: true
        default: current-schema-only
        type: choice
        options:
          - current-schema-only
          - versioned-migration
          - activation
      activation_artifact_id:
        description: Exact retained artifact ID for explicit activation only
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: BE required checks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'activation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      archive_hash: ${{ steps.verify.outputs.archive_hash }}
      artifact_hash: ${{ steps.verify.outputs.artifact_hash }}
      source_tree: ${{ steps.verify.outputs.source_tree }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    services:
      postgres:
        image: postgres:17.11@sha256:0b81cec82228160abfa753aeaad0609b709eb26eeb950f2e404ad2326e1cc370
        env:
          POSTGRES_USER: foundation_local
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: foundation_local
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U foundation_local -d foundation_local"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out exact event source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set pinned Node without shared dependency cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Explain production gating without credentials
        env:
          DELIVERY_ENABLED: ${{ vars.BE_DELIVERY_ENABLED }}
          DELIVERY_MODE: ${{ inputs.mode || vars.BE_DELIVERY_MODE || 'current-schema-only' }}
          SCHEMA_APPROVED: ${{ vars.BE_DELIVERY_SCHEMA_SHA256 != '' }}
        run: |
          printf '## BE delivery gate\nEnabled: `%s`\nMode: `%s`\nApproved schema configured: `%s`\n\nChecks success is not deployment acceptance. Production requires be-production inputs and successful exact-artifact final-domain checks.\n' \
            "$DELIVERY_ENABLED" "$DELIVERY_MODE" "$SCHEMA_APPROVED" >> "$GITHUB_STEP_SUMMARY"
      - name: Install unchanged-lock API dependencies on this disposable runner
        run: npm ci --workspace=@esty-admin/api --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - name: Verify generated contract and compile
        run: |
          npm run codegen:check --workspace=@esty-admin/api
          npm run build --workspace=@esty-admin/api
      - name: Build native artifact and require functional plus actual HTTP-to-test-DB checks
        id: verify
        run: node apps/api/build/scripts/ci.js "$GITHUB_WORKSPACE" "$RUNNER_TEMP/be-transfer"
      - name: Retain one immutable mode-preserving tested bundle
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: be-tested-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/be-transfer/be-release.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  production:
    name: BE production delivery
    needs: checks
    if: >-
      github.repository == 'khuonghuyhieu/esty-admin' &&
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.BE_DELIVERY_ENABLED == 'true' &&
      (inputs.mode || vars.BE_DELIVERY_MODE || 'current-schema-only') != 'activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: be-production
    outputs:
      accepted: ${{ steps.routine_delivery.outcome == 'success' }}
    concurrency:
      group: esty-admin-be-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      BE_DELIVERY_ENABLED: ${{ vars.BE_DELIVERY_ENABLED }}
      BE_DELIVERY_ENVIRONMENT: be-production
      BE_DELIVERY_MODE: ${{ inputs.mode || vars.BE_DELIVERY_MODE || 'current-schema-only' }}
      BE_DELIVERY_SCHEMA_SHA256: ${{ vars.BE_DELIVERY_SCHEMA_SHA256 }}
      BE_MIGRATION_PACKET_JSON: ${{ vars.BE_MIGRATION_PACKET_JSON }}
      BE_MIGRATION_PACKET_SHA256: ${{ vars.BE_MIGRATION_PACKET_SHA256 }}
      ARTIFACT_SHA: ${{ needs.checks.outputs.artifact_hash }}
      SOURCE_TREE: ${{ needs.checks.outputs.source_tree }}
    steps:
      - name: Set exact delivery runtime without application installation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Download only this successful checks job's immutable artifact ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact_id }}
          path: ${{ runner.temp }}/be-transfer
          merge-multiple: true
      - name: Verify independent transfer digest before extracting or executing helpers
        env:
          ARCHIVE_SHA: ${{ needs.checks.outputs.archive_hash }}
        run: |
          [[ "$ARCHIVE_SHA" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$ARCHIVE_SHA" "$RUNNER_TEMP/be-transfer/be-release.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/be-consume"
          tar -xzf "$RUNNER_TEMP/be-transfer/be-release.tar.gz" -C "$RUNNER_TEMP/be-consume"
      - name: Bootstrap independently verified public CLI before secrets are present
        run: node "$RUNNER_TEMP/be-consume/runner/apps/api/build/scripts/ci-tools.js" "$RUNNER_TEMP/be-tools"
      - name: Reserve and confirm compatible versioned migration intent
        if: env.BE_DELIVERY_MODE == 'versioned-migration'
        env:
          BE_ROUTINE_ACTION: authorize
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: &routine-command >-
          node "$RUNNER_TEMP/be-consume/runner/apps/api/build/scripts/ci-delivery.js"
          "$RUNNER_TEMP/be-consume/artifact" "$ARTIFACT_SHA" "$SOURCE_TREE"
          "$RUNNER_TEMP/be-tools/node_modules/vercel/dist/vc.js" "$RUNNER_TEMP/be-receipts"
      - name: Apply approved versioned migrations in the SQL-only worker
        if: env.BE_DELIVERY_MODE == 'versioned-migration'
        env:
          BE_ROUTINE_ACTION: migrate
          BE_MIGRATION_INPUTS: ${{ secrets.BE_MIGRATION_INPUTS }}
        run: *routine-command
      - name: Reserve durable intent, validate candidate, promote once and verify exact domain
        id: routine_delivery
        if: env.BE_DELIVERY_MODE != 'activation'
        env:
          BE_ROUTINE_ACTION: deliver
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BE_DELIVERY_ENABLED: ${{ vars.BE_DELIVERY_ENABLED }}
          BE_DELIVERY_ENVIRONMENT: be-production
        run: *routine-command
      - name: Preserve private receipt modes and record the exact transferable inventory
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/be-receipts" ]; then
            node --input-type=module -e \
              'const {inventory,canonical,sha256}=await import(process.argv[1]); console.log(sha256(canonical(inventory(process.argv[2]))));' \
              "$RUNNER_TEMP/be-consume/runner/apps/api/build/scripts/artifact.js" "$RUNNER_TEMP/be-receipts" \
              > "$RUNNER_TEMP/be-delivery-receipts.inventory-sha256"
            tar -czf "$RUNNER_TEMP/be-delivery-receipts.tar.gz" -C "$RUNNER_TEMP" be-receipts
            sha256sum "$RUNNER_TEMP/be-delivery-receipts.tar.gz" > "$RUNNER_TEMP/be-delivery-receipts.archive-sha256"
          fi
      - name: Retain sanitized receipts without secret-bearing subprocess logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: be-delivery-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/be-delivery-receipts.tar.gz
            ${{ runner.temp }}/be-delivery-receipts.inventory-sha256
            ${{ runner.temp }}/be-delivery-receipts.archive-sha256
          if-no-files-found: ignore
          retention-days: 30
          overwrite: false

  manual_retrieval:
    name: Select the owner-approved retained activation bundle
    if: >-
      github.repository == 'khuonghuyhieu/esty-admin' &&
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: be-production
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.relay.outputs.artifact-id }}
      selection_sha: ${{ steps.select.outputs.selection_sha }}
    env:
      BE_DELIVERY_ENVIRONMENT: be-production
      BE_DELIVERY_MODE: activation
      BE_ACTIVATION_ENABLED: ${{ vars.BE_ACTIVATION_ENABLED }}
      BE_ACTIVATION_WORKFLOW_SHA: ${{ vars.BE_ACTIVATION_WORKFLOW_SHA }}
      BE_ACTIVATION_PACKET_JSON: ${{ vars.BE_ACTIVATION_PACKET_JSON }}
      BE_ACTIVATION_PACKET_SHA256: ${{ vars.BE_ACTIVATION_PACKET_SHA256 }}
    steps:
      - name: Check out the actual reviewed workflow source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set the exact runtime without application installation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Validate explicit approval and select exact retained metadata before retrieval
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/api/scripts/activation-retained.mjs select "$RUNNER_TEMP/be-transfer"
      - name: Retrieve only the selected retained run and artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          repository: khuonghuyhieu/esty-admin
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/be-transfer
          merge-multiple: true
      - name: Verify the original archive before extraction and bind the full sealed bundle
        env:
          SELECTION_SHA: ${{ steps.select.outputs.selection_sha }}
        run: |
          node apps/api/scripts/activation-retained.mjs verify-relay "$RUNNER_TEMP/be-transfer" "$SELECTION_SHA"
          mkdir "$RUNNER_TEMP/be-consume"
          tar -xzf "$RUNNER_TEMP/be-transfer/be-release.tar.gz" -C "$RUNNER_TEMP/be-consume"
          node apps/api/scripts/activation-retained.mjs verify-bundle "$RUNNER_TEMP/be-consume" "$RUNNER_TEMP/be-transfer/selection.json" "$SELECTION_SHA"
      - name: Relay only the unchanged original archive and independently bound selection
        id: relay
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: be-retained-activation-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/be-transfer/be-release.tar.gz
            ${{ runner.temp }}/be-transfer/selection.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  manual_activation:
    name: Activate the owner-approved retained bundle
    needs: manual_retrieval
    if: >-
      github.repository == 'khuonghuyhieu/esty-admin' &&
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: be-production
    outputs:
      accepted: ${{ steps.activation_delivery.outcome == 'success' }}
    concurrency:
      group: esty-admin-be-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      BE_DELIVERY_ENVIRONMENT: be-production
      BE_DELIVERY_MODE: activation
      BE_ACTIVATION_ENABLED: ${{ vars.BE_ACTIVATION_ENABLED }}
      BE_ACTIVATION_WORKFLOW_SHA: ${{ vars.BE_ACTIVATION_WORKFLOW_SHA }}
      BE_ACTIVATION_PACKET_JSON: ${{ vars.BE_ACTIVATION_PACKET_JSON }}
      BE_ACTIVATION_PACKET_SHA256: ${{ vars.BE_ACTIVATION_PACKET_SHA256 }}
      BE_ACTIVATION_SELECTION_SHA256: ${{ needs.manual_retrieval.outputs.selection_sha }}
    steps:
      - name: Check out the actual reviewed workflow source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set the exact runtime without application installation
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Download only this run's verified transport relay without cross-run credentials
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.manual_retrieval.outputs.artifact_id }}
          path: ${{ runner.temp }}/be-transfer
          merge-multiple: true
      - name: Revalidate the selection and original archive before extraction or helper execution
        run: |
          node apps/api/scripts/activation-retained.mjs verify-relay "$RUNNER_TEMP/be-transfer" "$BE_ACTIVATION_SELECTION_SHA256"
          mkdir "$RUNNER_TEMP/be-consume"
          tar -xzf "$RUNNER_TEMP/be-transfer/be-release.tar.gz" -C "$RUNNER_TEMP/be-consume"
          node apps/api/scripts/activation-retained.mjs verify-bundle "$RUNNER_TEMP/be-consume" "$RUNNER_TEMP/be-transfer/selection.json" "$BE_ACTIVATION_SELECTION_SHA256"
      - name: Bootstrap independently verified public CLI before secrets are present
        run: node "$RUNNER_TEMP/be-consume/runner/apps/api/build/scripts/ci-tools.js" "$RUNNER_TEMP/be-tools"
      - name: Prepare the explicitly approved public activation packet without credentials
        if: &activation-mode env.BE_DELIVERY_MODE == 'activation'
        env:
          ACTIVATION_ACTION: prepare
          ACTIVATION_PHASE: "-"
          BE_ACTIVATION_PACKET_JSON: ${{ vars.BE_ACTIVATION_PACKET_JSON }}
        run: &activation-command >-
          node apps/api/scripts/manual-activation.mjs
          "$ACTIVATION_ACTION" "$ACTIVATION_PHASE"
          "$RUNNER_TEMP/be-consume" "$RUNNER_TEMP/be-transfer/selection.json"
          "$RUNNER_TEMP/be-receipts" "$RUNNER_TEMP/be-tools/node_modules/vercel/dist/vc.js"
      - name: Reserve the shared durable production exclusion
        if: *activation-mode
        env:
          ACTIVATION_ACTION: reserve
          ACTIVATION_PHASE: "-"
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Verify exact OLD history and role prerequisites without writes
        if: *activation-mode
        env:
          ACTIVATION_ACTION: preflight
          ACTIVATION_PHASE: "-"
          ACTIVATION_ROLE_INPUTS: ${{ secrets.BE_ACTIVATION_ROLE_INPUTS }}
        run: *activation-command
      - name: Authorize bridge configuration durably
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: bridge-config
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Configure only approved bridge Production inputs
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: bridge-config
          GITHUB_TOKEN: ${{ github.token }} # Parent-only fresh main guard; never forwarded to the private worker.
          VERCEL_CONFIGURATION_TOKEN: ${{ secrets.VERCEL_CONFIGURATION_TOKEN }}
          ACTIVATION_BRIDGE_INPUTS: ${{ secrets.BE_ACTIVATION_BRIDGE_INPUTS }}
        run: *activation-command
      - name: Confirm bridge configuration before any create
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: bridge-config
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Authorize one immutable bridge candidate
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: bridge
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Create attest and promote the bridge without runtime inputs in CREATE
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: bridge
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Confirm the bridge before SQL mutation
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: bridge
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Authorize role provisioning
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: roles
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Provision or verify fixed application roles
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: roles
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVATION_ROLE_INPUTS: ${{ secrets.BE_ACTIVATION_ROLE_INPUTS }}
        run: *activation-command
      - name: Confirm role outcome
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: roles
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Authorize the ordinary two-file migration batch
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: migration
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Execute the ordinary OLD to TARGET migration runner once
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: migration
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVATION_MIGRATION_INPUTS: ${{ secrets.BE_ACTIVATION_MIGRATION_INPUTS }}
        run: *activation-command
      - name: Verify TARGET roles effective privileges and definer without writes
        if: *activation-mode
        env:
          ACTIVATION_ACTION: postflight
          ACTIVATION_PHASE: migration
          ACTIVATION_ROLE_INPUTS: ${{ secrets.BE_ACTIVATION_ROLE_INPUTS }}
        run: *activation-command
      - name: Confirm migration and postflight before bootstrap
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: migration
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Authorize the existing-identity bootstrap
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: bootstrap
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Bootstrap and inspect only the approved existing identity
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: bootstrap
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVATION_BOOTSTRAP_INPUTS: ${{ secrets.BE_ACTIVATION_BOOTSTRAP_INPUTS }}
        run: *activation-command
      - name: Confirm bootstrap outcome without blind replay
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: bootstrap
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Authorize strict app configuration independently
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: app-config
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Configure only approved strict app Production inputs
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: app-config
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_CONFIGURATION_TOKEN: ${{ secrets.VERCEL_CONFIGURATION_TOKEN }}
          ACTIVATION_APP_INPUTS: ${{ secrets.BE_ACTIVATION_APP_INPUTS }}
        run: *activation-command
      - name: Confirm strict app configuration before its create
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: app-config
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Authorize one strict app candidate
        if: *activation-mode
        env:
          ACTIVATION_ACTION: authorize
          ACTIVATION_PHASE: app
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Consume the same immutable artifact and attest actual strict runtime
        if: *activation-mode
        env:
          ACTIVATION_ACTION: run
          ACTIVATION_PHASE: app
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Confirm strict BE and retain the external FE acceptance gate
        id: activation_delivery
        if: *activation-mode
        env:
          ACTIVATION_ACTION: confirm
          ACTIVATION_PHASE: app
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BE_PREVIEW_ACCESS_KEY: ${{ secrets.BE_PREVIEW_ACCESS_KEY }}
        run: *activation-command
      - name: Preserve private receipt modes and record the exact transferable inventory
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/be-receipts" ]; then
            node --input-type=module -e \
              'const {inventory,canonical,sha256}=await import(process.argv[1]); console.log(sha256(canonical(inventory(process.argv[2]))));' \
              "$RUNNER_TEMP/be-consume/runner/apps/api/build/scripts/artifact.js" "$RUNNER_TEMP/be-receipts" \
              > "$RUNNER_TEMP/be-delivery-receipts.inventory-sha256"
            tar -czf "$RUNNER_TEMP/be-delivery-receipts.tar.gz" -C "$RUNNER_TEMP" be-receipts
            sha256sum "$RUNNER_TEMP/be-delivery-receipts.tar.gz" > "$RUNNER_TEMP/be-delivery-receipts.archive-sha256"
          fi
      - name: Retain sanitized receipts without secret-bearing subprocess logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: be-delivery-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/be-delivery-receipts.tar.gz
            ${{ runner.temp }}/be-delivery-receipts.inventory-sha256
            ${{ runner.temp }}/be-delivery-receipts.archive-sha256
          if-no-files-found: ignore
          retention-days: 30
          overwrite: false

  completion:
    name: BE delivery accepted
    needs: [checks, production, manual_retrieval, manual_activation]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful exact-artifact delivery, never a skipped job
        env:
          MANUAL_ACTIVATION: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'activation' }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DELIVERY_RESULT: ${{ needs.production.result }}
          DELIVERY_ACCEPTED: ${{ needs.production.outputs.accepted }}
          RETRIEVAL_RESULT: ${{ needs.manual_retrieval.result }}
          ACTIVATION_RESULT: ${{ needs.manual_activation.result }}
          ACTIVATION_ACCEPTED: ${{ needs.manual_activation.outputs.accepted }}
        shell: bash
        run: |
          if [[ "$MANUAL_ACTIVATION" == true ]]; then
            if [[ "$RETRIEVAL_RESULT" != success || "$ACTIVATION_RESULT" != success || "$ACTIVATION_ACCEPTED" != true ]]; then
              printf '%s\n' 'BE activation not accepted: retained retrieval, activation and final BE acceptance must all succeed.' >&2
              exit 1
            fi
          elif [[ "$CHECKS_RESULT" != success || "$DELIVERY_RESULT" != success || "$DELIVERY_ACCEPTED" != true ]]; then
            printf '%s\n' 'BE delivery not accepted: checks, production and final delivery acceptance must all succeed.' >&2
            exit 1
          fi
          printf '%s\n' 'Exact-artifact BE delivery accepted. First-activation FE acceptance remains a separate gate.'
