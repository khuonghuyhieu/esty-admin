name: esty005-auth-fixture
services:
  db:
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    labels:
      esty005.run: ${F005_RUN_NONCE:?Explicit owned run required}
    environment:
      POSTGRES_USER: f005_fixture_admin
      POSTGRES_PASSWORD: synthetic_f005_admin_only
      POSTGRES_DB: ${F005_DATABASE_NAME:?Random owned database required}
      F005_RUN_NONCE: ${F005_RUN_NONCE}
    ports: ["127.0.0.1:55440:5432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./init-auth-db.sh:/docker-entrypoint-initdb.d/005-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U f005_fixture_admin -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [fixture]
  mail:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    labels:
      esty005.run: ${F005_RUN_NONCE}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "200"
    ports: ["127.0.0.1:55442:8025"]
    tmpfs: [/data]
    networks: [fixture]
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    labels:
      esty005.run: ${F005_RUN_NONCE}
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    ports: ["127.0.0.1:55441:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:55441
      GOTRUE_SITE_URL: http://127.0.0.1:55443
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:55443/auth/invitation,http://127.0.0.1:55443/auth/recovery
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:synthetic_f005_auth_only@db:5432/${F005_DATABASE_NAME}?sslmode=disable
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "300"
      GOTRUE_JWT_ISSUER: http://127.0.0.1:55441
      GOTRUE_JWT_SECRET: ${F005_JWT_SECRET:?Synthetic signing secret required}
      GOTRUE_JWT_KEYS: ${F005_JWT_KEYS:?Synthetic signing JWK required}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: "10"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: fixture@example.test
      GOTRUE_SMTP_SENDER_NAME: Synthetic Fixture
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_LOG_LEVEL: error
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:9999/health]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [fixture]
networks:
  fixture:
    internal: true
    labels:
      esty005.run: ${F005_RUN_NONCE}
